[package]
name = "rnetrbin-svc"
version = "0.1.0"
edition = "2021"

[lib]
name = "rnetrbin_svc"
path = "src/lib.rs"

[[bin]]
name = "rnetrbin-svc"
path = "src/main.rs"

[dependencies]
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
widestring = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
windows-service = "0.7"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Storage_InstallableFileSystems",
  "Win32_System_Services",
  "Win32_Security",
]

[dev-dependencies]
tempfile = "3"
