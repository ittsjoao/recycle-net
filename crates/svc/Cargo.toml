[package]
name = "rnetrbin-svc"
version = "0.1.0"
edition = "2021"

[lib]
name = "rnetrbin_svc"
path = "src/lib.rs"

[[bin]]
name = "rnetrbin-svc"
path = "src/main.rs"

[dependencies]
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
widestring = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
windows-service = "0.7"
ctrlc = "3"
# wgpu with tiny-skia software fallback: renders over RDP without a GPU.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "crisp"] }
rfd = { version = "0.17.2", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Storage_InstallableFileSystems",
  "Win32_System_Services",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_System_EventLog",
]

[dev-dependencies]
tempfile = "3"
